name: Build APK

on:
  push:
    branches: [main, master]
    paths:
      - 'app/**'
      - 'gradle/**'
      - '*.gradle.kts'
  pull_request:
    branches: [main, master]
    paths:
      - 'app/**'
      - 'gradle/**'
      - '*.gradle.kts'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Decode google-services.json
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON_BASE64" ]; then
            echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 -d > app/google-services.json
          else
            echo '{"project_info":{"project_number":"0","project_id":"quickdash-mock","storage_bucket":"quickdash.appspot.com"},"client":[{"client_info":{"mobilesdk_app_id":"1:0:android:0","android_client_info":{"package_name":"com.balajitechlabs.quickdash"}},"api_key":[{"current_key":"mock"}]}]}' > app/google-services.json
          fi
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}

      - name: Create local.properties
        run: |
          echo "TG_BOT_TOKEN=${{ secrets.TG_BOT_TOKEN }}" >> local.properties
          echo "TG_BROADCAST_BOT_TOKEN=${{ secrets.TG_BROADCAST_BOT_TOKEN }}" >> local.properties
          echo "TG_CHAT_ID=${{ secrets.TG_CHAT_ID }}" >> local.properties
          echo "sdk.dir=$ANDROID_HOME" >> local.properties

      - name: Decode keystore
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > keystore.jks
          else
            echo "Skipping — no keystore provided"
          fi
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}

      - name: Build Debug APK
        run: ./gradlew assembleDebug

      - name: Build Release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          SIGNING_FLAGS=""
          if [ -f keystore.jks ]; then
            KEYSTORE_PATH=$(pwd)/keystore.jks
            SIGNING_FLAGS="-Pandroid.injected.signing.store.file=$KEYSTORE_PATH \
                          -Pandroid.injected.signing.store.password=$KEYSTORE_PASSWORD \
                          -Pandroid.injected.signing.key.alias=$KEY_ALIAS \
                          -Pandroid.injected.signing.key.password=$KEY_PASSWORD"
          fi
          eval ./gradlew assembleRelease "$SIGNING_FLAGS"

      - name: Lint check
        run: ./gradlew lint

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest

      - name: Collect APK artifacts
        run: |
          mkdir -p apk_artifacts
          cp app/build/outputs/apk/debug/*.apk apk_artifacts/ 2>/dev/null || true
          cp app/build/outputs/apk/release/*.apk apk_artifacts/ 2>/dev/null || true
          ls -lh apk_artifacts/

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: quickdash-debug-apk
          path: apk_artifacts/*-debug.apk
          retention-days: 14

      - name: Upload Release APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quickdash-release-apk
          path: apk_artifacts/*-release.apk
          retention-days: 14
